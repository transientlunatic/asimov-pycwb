[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "asimov-pycwb"
version = "0.1.0"
description = "An asimov pipeline plugin wrapping pycWB's targeted single-candidate reconstruction mode"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "asimov",
    "pycWB",
    "liquidpy",
]

[project.optional-dependencies]
test = ["pytest"]

[project.entry-points."asimov.pipelines"]
pycwb = "asimov_pycwb:PyCWB"

[tool.setuptools.packages.find]
include = ["asimov_pycwb*"]

[tool.setuptools.package-data]
asimov_pycwb = ["templates/*.liquid"]
