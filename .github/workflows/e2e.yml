name: End-to-end test (real pycWB, real HTCondor)

on:
  push:
    branches: ['**']
    tags: ['*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e:
    name: "pycWB end-to-end test (HTCondor)"
    runs-on: ubuntu-latest
    # Generous ceiling: this run is genuinely tiny (a 36s segment, single
    # job, no lags), but pycWB's first-run cost - the XTALK wavelet catalog
    # download, plus numba/jax JIT warmup - is unverified in CI as of this
    # workflow's first run, so this errs on the side of a long timeout
    # rather than a flaky one. Tighten it once a real run's wall-clock time
    # is known.
    timeout-minutes: 30
    container:
      image: htcondor/mini:latest
      # --shm-size: Docker's default /dev/shm is 64MB. pycwb_batch's
      # worker process was crashing completely silently (no Python
      # traceback in stdout or stderr, no HTCondor "abnormal termination"
      # detail - just stops right where multiprocessing starts handing
      # work to the worker) under both the "jax" and "numba" max-energy
      # backends alike, which points at something backend-independent:
      # numpy/numba/jax-based multiprocessing workers commonly rely on
      # /dev/shm-backed shared memory for large arrays, and a too-small
      # /dev/shm classically manifests as exactly this - a silent
      # SIGSEGV/SIGBUS with no Python-level diagnostic at all.
      options: --privileged --shm-size=1g
    defaults:
      run:
        shell: bash -el {0}
    steps:

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: etive-io/actions/setup-htcondor@v1

      - name: Install base tools
        run: |
          yum install -y sudo git

      - name: Create submit user
        uses: etive-io/actions/create-submit-user@v1

      # By default DAGMan tries to fetch OAuth/Kerberos-style job
      # credentials from a credd for every node job it submits
      # (DAGMAN_PRODUCE_JOB_CREDENTIALS). This minimal test pool has no
      # credd and the daemon can't even read /etc/condor/passwords.d
      # (Permission denied), so every node submission failed outright:
      # "ERROR: on Line N of submit file: Failed to produce job
      # credentials: Can't find address of credd" - confirmed directly in
      # condor_dagman's own dagman.out. None of pycWB's jobs need
      # credentials, so just turn this off for the pool.
      - name: Disable DAGMan job credential production
        run: |
          mkdir -p /etc/condor/config.d
          echo "DAGMAN_PRODUCE_JOB_CREDENTIALS = False" > /etc/condor/config.d/99-no-job-credentials.conf
          condor_reconfig || true

      - name: Ensure submituser can access workspace
        run: |
          mkdir -p "$GITHUB_WORKSPACE/e2e_project"
          chmod -R a+rwX "$GITHUB_WORKSPACE"

      - name: Setup asimov-pycwb Environment
        uses: ./.github/actions/setup-pycwb-env
        with:
          python-version: "3.11"

      - name: Set up git
        run: |
          su - submituser <<SUBMITUSER
          set -euo pipefail
          git config --global init.defaultBranch master
          git config --global user.email "you@example.com"
          git config --global user.name "Your Name"
          SUBMITUSER

      - name: Create asimov project
        uses: etive-io/actions/run-asimov-command@v1
        with:
          script: cd e2e_project && asimov init "E2E Test Project"

      - name: Diagnose asimov.pipelines entry-point discovery as submituser
        uses: etive-io/actions/run-asimov-command@v1
        with:
          script: |
            python3 -c "
            from importlib.metadata import entry_points
            eps = [ep for ep in entry_points(group='asimov.pipelines') if ep.value.startswith('asimov_pycwb')]
            print('Discovered asimov_pycwb entry points:', eps)
            for ep in eps:
                try:
                    ep.load()
                    print(f'  {ep.name}: loaded OK')
                except Exception as e:
                    print(f'  {ep.name}: FAILED TO LOAD: {e!r}')
            "

      - name: Apply fake event
        uses: etive-io/actions/run-asimov-command@v1
        with:
          script: |
            cd e2e_project
            asimov apply -f "$GITHUB_WORKSPACE/tests/e2e/fake_event.yaml"

      # pycWB needs no real strain data, datafind server, or the separate
      # asimov-gwdata plugin: it runs against its own built-in simulated
      # Gaussian noise (`injection.noise`, using pycwb.modules.noise's
      # analytic aLIGOZeroDetHighPower PSD model) via a single sine-Gaussian
      # burst injection, so the production under test is entirely
      # self-contained.
      #
      # This is the "pre-seed a real config" alternative from the
      # e2e-testing howto, rather than exercising asimov_pycwb's
      # config_template Liquid rendering (which is covered separately by
      # tests/test_pipeline_template.py): synthetic-noise injection is not
      # something the template supports yet (see this plugin's README), so
      # PyCWB.build_dag() looks for a pre-existing
      # <production name>.yaml in the event repository's `analyses/`
      # directory first (PyCWB._find_existing_config()) and uses it as-is
      # when present.
      #
      # These settings (2 detectors, synthetic Gaussian noise, a single
      # sine-Gaussian burst injection at hrss=4e-22, a 36s segment with
      # correspondingly reduced segLen/segMLS/segTHR/resolution-level
      # settings) follow the shape of pycWB's own
      # examples/new_injection_infra_with_gaussian_noise example, adapted
      # for a much shorter segment so the run completes quickly. Unlike the
      # sibling asimov-pycbc e2e test, this hasn't been hand-validated by
      # running pycWB directly first: the XTALK wavelet catalog pycWB
      # downloads on first use is fetched from a repository outside this
      # development environment's network access, so this exact
      # configuration may need adjusting once it's actually exercised here.
      - name: Seed the pycWB config fixture
        uses: etive-io/actions/run-asimov-command@v1
        with:
          script: |
            cd e2e_project/checkouts/FAKE_PYCWB_TEST_EVENT
            mkdir -p analyses
            cat > analyses/pycwb-test.yaml << 'EOF'
            outputDir: "output"
            nproc: 1

            analysis: "2G"
            cfg_search: "r"

            ifo: ["H1", "L1"]
            refIFO: "H1"

            lagSize: 1
            lagStep: 1.
            lagOff: 0
            lagMax: 0

            slagSize: 1
            slagMin: 0
            slagMax: 0
            slagOff: 0

            # segEdge must be >= the wavelet filter length pycWB computes
            # from levelR/l_low/l_high (~6.0s here) - confirmed directly:
            # "Filter length must be <= segEdge (filter=6.00048828125 sec,
            # segEdge=2.0 sec)" was the very next real error once the
            # whiteWindow fix (below) got past the whitening crash. Then,
            # once segEdge=8 satisfied that, the next real check was
            # stricter still: "segEdge must be > 1.5x the length for time
            # delay amplitudes" (i.e. > ~9.0s) - segEdge=12 clears both.
            # segLen grows to keep the same 12s analyze window
            # (segLen - 2*segEdge) as before.
            segLen: 36
            segMLS: 8
            segTHR: 4
            segEdge: 12

            # pycwb_batch's real error (finally found in log/job_1.log,
            # which the batch-1-1.out/.err HTCondor captures never show -
            # pycWB's processor_wrapper() re-inits logging to this
            # separate per-job file): "IndexError: index 60 is out of
            # bounds for axis 1 with size 32" during whitening. whiteWindow
            # defaults to a fixed 60s, but this test's segment is only 16s
            # long - the whitening code indexes assuming a window that
            # doesn't fit inside the segment at all. Per pycWB's own
            # schema (pycwb.constants.user_parameters_schema), whiteWindow
            # = 0 means "use the segment's own duration" instead of a
            # fixed value, which is what a segment this short needs.
            whiteWindow: 0

            fLow: 32.
            fHigh: 512.

            levelR: 3
            l_low: 4
            l_high: 10

            # pycwb_batch's worker process was crashing silently (no
            # Python traceback at all - the job's own log just stopped
            # mid-run, and HTCondor's job event log showed it held only
            # ~3s after its last resource-usage sample) under the default
            # "jax" backend for coherence's time-delay max-energy maps -
            # most likely a JAX/XLA compatibility issue in this minimal,
            # GPU-less container. "numba" is a supported alternative
            # backend (see pycwb.constants.user_parameters_schema) that
            # avoids JAX entirely.
            max_energy_backend: "numba"

            wdmXTalk: "wdmXTalk/OverlapCatalog16-1024.bin"
            healpix: 3

            bpp: 0.001
            subnet: 0.5
            subcut: -1.0
            netRHO: 5.0
            cedRHO: 5.0
            netCC: 0.5
            Acore: 1.7
            Tgap: 0.2
            Fgap: 128.0
            delta: 0.5
            cfg_gamma: -1.0
            LOUD: 300

            pattern: 10
            iwindow: 100

            # Widened to keep the same 12s analyze window and injection
            # placement (gps_time=1000000008, still centered) now that
            # segLen/segEdge grew to fit the wavelet filter length above.
            gps_start: 999999990
            gps_end: 1000000026

            save_cluster: True
            save_sky_map: True
            plot_sky_map: False
            plot_trigger: False
            save_waveform: True
            plot_waveform: False

            injection:
              seed: 1234
              parameters:
                approximant: "SGE"
                frequency: 235.0
                Q: 6.0
                ellipticity: 0.0
                hrss: 4.0e-22
                ra: 1.0
                dec: 0.3
                pol: 0.0
                gps_time: 1000000008.0
                t_start: -1.0
                t_end: 1.0
              generator: "burst_waveform.interface.generate_waveform_pycwb.get_td_waveform"
              noise:
                type: "GaussianNoise"
                psds:
                  H1: null
                  L1: null
                delta_seeds:
                  H1: 10
                  L1: 20
            EOF
            git add analyses/pycwb-test.yaml
            git commit -m "Seed pycWB config fixture"

      - name: Add and build the real pycWB production
        uses: etive-io/actions/run-asimov-command@v1
        with:
          script: |
            cd e2e_project
            asimov apply -f "$GITHUB_WORKSPACE/tests/e2e/pycwb_production.yaml" -e FAKE_PYCWB_TEST_EVENT
            asimov manage build submit

      - name: Inspect the generated DAG
        uses: etive-io/actions/run-asimov-command@v1
        with:
          script: |
            cd e2e_project
            find working/FAKE_PYCWB_TEST_EVENT/pycwb-test -maxdepth 2
            echo "--- condor/run.sh ---"
            cat working/FAKE_PYCWB_TEST_EVENT/pycwb-test/condor/run.sh
            # A real pycwb batch-runner invocation against the seeded config,
            # not a stub.
            grep -q "pycwb batch-runner" working/FAKE_PYCWB_TEST_EVENT/pycwb-test/condor/run.sh
            grep -q "config/user_parameters.yaml" working/FAKE_PYCWB_TEST_EVENT/pycwb-test/condor/run.sh
            test -f working/FAKE_PYCWB_TEST_EVENT/pycwb-test/condor/pycwb-test.dag

      # Temporary diagnostic step: the previous run submitted a DAG (asimov
      # logged "Submitted ...") but condor_q showed zero jobs for the
      # entire 600s wait, and progress.parquet never appeared. This prints
      # the full DAG description and whatever DAGMan/condor state exists
      # immediately after submission, to see whether the DAG actually has
      # any work nodes and whether DAGMan itself ever ran.
      - name: "Debug: inspect DAGMan/condor state right after submission"
        uses: etive-io/actions/run-asimov-command@v1
        with:
          script: |
            cd e2e_project/working/FAKE_PYCWB_TEST_EVENT/pycwb-test
            echo "--- Full DAG file (condor/pycwb-test.dag) ---"
            cat condor/pycwb-test.dag
            # Give DAGMan a few seconds to run (or crash) and flush its log,
            # since the previous attempt at this diagnostic caught it too
            # early: condor_q showed the condor_dagman job running for the
            # very first poll, then gone by the next poll ~0.1s later.
            sleep 5
            echo "--- condor/ directory listing ---"
            ls -la condor/
            echo "--- condor_q -allusers -nobatch ---"
            condor_q -allusers -nobatch || true
            echo "--- condor_history (default) ---"
            condor_history || true
            echo "--- condor/pycwb-test.dag.dagman.out ---"
            cat condor/pycwb-test.dag.dagman.out || echo "(missing)"
            echo "--- condor/pycwb-test.dag.lib.out ---"
            cat condor/pycwb-test.dag.lib.out || echo "(missing)"
            echo "--- condor/pycwb-test.dag.lib.err ---"
            cat condor/pycwb-test.dag.lib.err || echo "(missing)"
            echo "--- condor/pycwb-test.dag.nodes.log ---"
            cat condor/pycwb-test.dag.nodes.log || echo "(missing)"
            echo "--- condor/pycwb_batch.sub ---"
            cat condor/pycwb_batch.sub || echo "(missing)"
            echo "--- condor/simulation_summary.sub ---"
            cat condor/simulation_summary.sub || echo "(missing)"
            echo "--- condor/merge.sub ---"
            cat condor/merge.sub || echo "(missing)"

      # Temporary diagnostic step: with the cwd and scitokens fixes, both
      # node jobs now actually run - but pycwb_batch:0 held with "The job
      # attribute OnExitHold expression '(ExitCode != 0)' evaluated to
      # TRUE" (pycWB's own condor.py sets on_exit_hold = (ExitCode != 0)
      # on the batch job specifically), meaning pycwb batch-runner itself
      # exited nonzero. Give it time to actually finish (or hold) and dump
      # its real stdout/stderr to see why.
      - name: "Debug: dump batch/merge job logs after they run"
        uses: etive-io/actions/run-asimov-command@v1
        with:
          script: |
            echo "--- /dev/shm size (confirming the --shm-size=1g fix took effect) ---"
            df -h /dev/shm || echo "(df unavailable)"
            cd e2e_project/working/FAKE_PYCWB_TEST_EVENT/pycwb-test
            # 30s wasn't enough last time: the batch job was still mid-run
            # ("1 running, 0 held") at the 30s mark and only held ~10s
            # later, so the earlier snapshot of its .err file was captured
            # before the real (post-PATH-fix) failure was even written.
            sleep 90
            echo "--- condor_q -allusers -hold ---"
            condor_q -allusers -hold || true
            echo "--- log/ directory listing ---"
            ls -la log/ || echo "(no log dir)"
            # run-asimov-command wraps this script in an *unquoted* heredoc
            # (su - submituser <<SUBMITUSER), so the outer shell expands any
            # $variable here to empty before the inner shell ever runs it -
            # confirmed directly: an earlier "for f in log/*..." loop using
            # "$f" produced zero output even though the files existed,
            # because "$f" was already blanked out by the outer shell. Cat
            # the known filenames directly instead of using a shell variable.
            echo "--- log/batch-1-1.out ---"
            cat log/batch-1-1.out || echo "(missing)"
            echo "--- log/batch-1-1.err ---"
            cat log/batch-1-1.err || echo "(missing)"
            echo "--- log/simulation_summary.out ---"
            cat log/simulation_summary.out || echo "(missing)"
            echo "--- log/simulation_summary.err ---"
            cat log/simulation_summary.err || echo "(missing)"
            # batch-1-1.out/.err show pycwb starting cleanly (config
            # loaded, workers started) then just stop - no Python
            # traceback at all. That pattern (silent stop, no exception)
            # points at the worker process being killed by a signal
            # (OOM-kill or a native/jax crash) rather than a normal
            # nonzero exit. HTCondor's own job event log records the
            # actual termination signal/exit code and resource usage.
            echo "--- log/batch-1-1.log (HTCondor job event log) ---"
            cat log/batch-1-1.log || echo "(missing)"
            echo "--- dmesg tail (OOM-kill check, best-effort) ---"
            dmesg 2>/dev/null | tail -50 || echo "(dmesg unavailable)"

      # Temporary diagnostic step: neither the jax->numba backend switch
      # nor a larger /dev/shm nor unbuffered output changed pycwb_batch's
      # failure at all - identical silent stop right after "Starting 1
      # workers" / "Terminating worker processes...", no traceback ever,
      # every single time. That's now suspicious of something about
      # HTCondor's own job execution environment itself (cgroup/namespace
      # sandboxing, resource limits) rather than pycWB/numba/jax. Run the
      # exact same command directly as a plain shell command, completely
      # bypassing HTCondor, to see whether it's an HTCondor-execution
      # issue or a pycWB/container issue independent of condor.
      - name: "Debug: run pycwb batch-runner directly, bypassing HTCondor"
        uses: etive-io/actions/run-asimov-command@v1
        with:
          script: |
            cd e2e_project/working/FAKE_PYCWB_TEST_EVENT/pycwb-test
            echo "--- Running pycwb batch-runner directly (no HTCondor) ---"
            pycwb batch-runner config/user_parameters.yaml --work-dir=/__w/asimov-pycwb/asimov-pycwb/e2e_project/working/FAKE_PYCWB_TEST_EVENT/pycwb-test --jobs=1-1 --n-proc=1 2>&1 && echo "MANUAL RUN SUCCEEDED" || echo "MANUAL RUN FAILED (see output above)"
            # pycwb's own processor_wrapper() (pycwb/workflow/batch.py)
            # re-inits logging *inside each worker process* to a per-job
            # file, log/job_<index>.log - separate from the batch-1-1
            # .out/.err that HTCondor (or this manual run) captures. Any
            # real "Error processing job segment: ..." from a caught
            # exception in the worker goes there, not to stdout/stderr.
            # We never looked at this file until now.
            echo "--- log/job_1.log (per-worker log - the real error should be here) ---"
            cat log/job_1.log || echo "(missing)"
            echo "--- log/job_0.log (in case indexing starts at 0) ---"
            cat log/job_0.log || echo "(missing)"

      # This is the real completion criterion asimov_pycwb's
      # detect_completion() checks for -- not a smoke-test proxy.
      # catalog.parquet is *not* used here: pycWB creates it, empty, back
      # in "Add and build the real pycWB production" above (prepare_job_runs
      # calls Catalog.create() before any batch/merge job ever runs), so
      # waiting on it would pass immediately without the DAG having done
      # any real work. progress.parquet is only written by pycWB's merge
      # DAG node once the batch job has recorded real per-lag progress, so
      # reaching it means the merge node genuinely ran after the batch
      # analysis job, over pycWB's real (simulated-noise) output.
      - name: Wait for the real merge (progress.parquet)
        uses: etive-io/actions/wait-for-files@v1
        with:
          patterns: "progress.parquet"
          directory: "working/FAKE_PYCWB_TEST_EVENT/pycwb-test/catalog"
          timeout: "600"
          interval: "10"
          working-directory: "e2e_project"

      - name: Run asimov monitor for the pycWB production
        uses: etive-io/actions/run-asimov-command@v1
        with:
          script: cd e2e_project && asimov monitor

      - name: Verify the merged catalog and progress files are genuinely readable
        uses: etive-io/actions/run-asimov-command@v1
        with:
          script: |
            cd e2e_project
            python3 -c "
            import pyarrow.parquet as pq
            base = 'working/FAKE_PYCWB_TEST_EVENT/pycwb-test/catalog'
            catalog = pq.read_table(f'{base}/catalog.parquet')
            progress = pq.read_table(f'{base}/progress.parquet')
            print('Catalog columns:', catalog.schema.names)
            print('Trigger rows:', catalog.num_rows)
            print('Progress rows:', progress.num_rows)
            assert progress.num_rows > 0, 'progress.parquet exists but recorded no lags'
            # Not asserted: whether the injected sine-Gaussian burst actually
            # cleared cWB's detection thresholds is a question of signal
            # amplitude tuning this test doesn't try to guarantee. A
            # non-empty, readable progress file produced by a real merge is
            # this test's completion criterion; a nonzero trigger count is a
            # bonus signal, logged for visibility.
            "

      - name: Confirm the pycWB production reached a finished status
        uses: etive-io/actions/run-asimov-command@v1
        with:
          script: |
            cd e2e_project
            python3 -c "
            import yaml
            with open('.asimov/ledger.yml') as f:
                ledger = yaml.safe_load(f)
            event = next(e for e in ledger['events'] if e['name'] == 'FAKE_PYCWB_TEST_EVENT')
            production = next(p['pycwb-test'] for p in event['productions'] if 'pycwb-test' in p)
            status = production.get('status')
            print('pycwb-test status:', status)
            assert status == 'finished', f'Unexpected status: {status}'
            "

      - name: Archive artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-debug
          path: |
            e2e_project/.asimov/
            e2e_project/working/
            e2e_project/checkouts/
          retention-days: 5
